services:
  - type: web
    name: cerevyn-backend
    env: python
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn main:app --host 0.0.0.0 --port $PORT
    plan: starter  # change if you need persistent disk or bigger plan
    disk:
      # Remove this section if you don't attach a disk via dashboard.
      sizeGb: 10
